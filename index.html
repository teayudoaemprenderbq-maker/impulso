<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Control de Impulsos - Arándanos de Vida</title>
    <style>
        :root {
            --primary: #16a34a;
            --primary-hover: #15803d;
            --bg-color: #f3f4f6;
            --card-bg: #ffffff;
            --text-main: #1f2937;
            --border: #d1d5db;
        }
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            padding: 1rem;
            margin: 0;
            box-sizing: border-box;
        }
        .card {
            max-width: 450px;
            margin: 2rem auto;
            background: var(--card-bg);
            padding: 1.5rem;
            border-radius: 0.5rem;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            border-top: 4px solid var(--primary);
        }
        .logo-cliente {
            max-width: 140px;
            height: auto;
            display: block;
            margin: 0 auto 1rem auto;
        }
        .logo-dev {
            max-width: 110px;
            height: auto;
            display: block;
            margin: 2rem auto 0.5rem auto;
            opacity: 0.85;
        }
        .dev-text {
            text-align: center;
            font-size: 0.7rem;
            color: #9ca3af;
            margin-bottom: 0;
        }
        h2 { margin-top: 0; font-size: 1.5rem; margin-bottom: 1rem; color: var(--text-main); text-align: center; }
        h3 { font-size: 1.1rem; color: var(--primary); margin-top: 1rem; margin-bottom: 0.5rem; border-bottom: 1px solid var(--border); padding-bottom: 0.25rem; }
        label { display: block; font-size: 0.875rem; font-weight: 600; margin-bottom: 0.25rem; margin-top: 0.75rem; }
        input, select, textarea {
            width: 100%;
            padding: 0.75rem;
            margin-bottom: 0.5rem;
            border: 1px solid var(--border);
            border-radius: 0.25rem;
            box-sizing: border-box;
            font-size: 1rem;
            background-color: #f9fafb;
        }
        button {
            width: 100%;
            padding: 0.75rem;
            border: none;
            border-radius: 0.25rem;
            font-size: 1rem;
            font-weight: bold;
            color: white;
            cursor: pointer;
            margin-top: 1rem;
            background-color: var(--primary);
        }
        button:hover { background-color: var(--primary-hover); }
        .btn-outline {
            background-color: #eff6ff;
            color: #2563eb;
            border: 1px solid #bfdbfe;
            margin-bottom: 0.5rem;
        }
        .hidden { display: none !important; }
        #gps-data { font-size: 0.75rem; text-align: center; color: #6b7280; margin-bottom: 1rem; }
        .user-info { font-size: 0.875rem; color: #4b5563; margin-bottom: 1rem; text-align: center; font-weight: bold; }
    </style>
</head>
<body>
    <!-- Pantalla de Login -->
    <div id="login-screen" class="card">
        <img src="https://static.wixstatic.com/media/d0ce54_b23afa43d81f430dbe1c219e3f470f11~mv2.jpg" alt="Logo Cliente" class="logo-cliente">
        <h2>Acceso Impulsadores</h2>
        <input type="text" id="user" placeholder="Usuario">
        <input type="password" id="pass" placeholder="Contraseña">
        <button onclick="login()">Ingresar</button>
        
        <p class="dev-text">Desarrollado por</p>
        <img src="https://static.wixstatic.com/media/d0ce54_c999d1aa9976438a98b0f5b2157b7adc~mv2.png" alt="Logo Desarrollador" class="logo-dev">
    </div>
    <!-- Pantalla de Panel Administrativo -->
<div id="admin-screen" class="card hidden max-w-4xl mx-auto p-4">
    <h2 class="text-xl font-bold text-center mb-4">Panel de Control Administrativo</h2>
    <div class="flex justify-between items-center mb-4">
        <span id="admin-user-display" class="text-sm font-semibold text-gray-600"></span>
        <button onclick="cerrarSesion()" class="bg-red-500 text-white px-3 py-1 rounded text-sm">Cerrar Sesión</button>
    </div>
    
    <div class="overflow-x-auto">
        <table class="min-w-full bg-white border border-gray-200 text-sm">
            <thead>
                <tr class="bg-gray-100 border-b">
                    <th class="py-2 px-3 text-left">Tienda</th>
                    <th class="py-2 px-3 text-left">Usuario</th>
                    <th class="py-2 px-3 text-left">Fecha / Hora</th>
                    <th class="py-2 px-3 text-center">Estado</th>
                    <th class="py-2 px-3 text-center">Ventas</th>
                    <th class="py-2 px-3 text-center">Evidencias</th>
                </tr>
            </thead>
            <tbody id="tabla-registros-body">
                <!-- Los registros se cargan dinámicamente aquí -->
            </tbody>
        </table>
    </div>
    <button onclick="cargarRegistrosAdmin()" class="mt-4 bg-blue-600 text-white py-2 px-4 rounded w-full">Actualizar Tabla</button>
</div>

    <!-- Pantalla Principal -->
    <div id="app-screen" class="card hidden">
        <img src="https://static.wixstatic.com/media/d0ce54_b23afa43d81f430dbe1c219e3f470f11~mv2.jpg" alt="Logo Cliente" class="logo-cliente">
        <h2>Registro de Impulso</h2>
        <div id="user-display" class="user-info"></div>

        <label>Seleccionar Acción</label>
        <select id="tipo_accion" onchange="cambiarModoAccion()">
            <option value="inicio">Inicio de Turno</option>
            <option value="final">Final de Turno</option>
        </select>

        <label>Seleccionar Cliente / Tienda</label>
        <select id="select_cliente">
            <option value="">Cargando clientes...</option>
        </select>

        <button type="button" onclick="capturarGPS()" class="btn-outline">📍 Capturar Coordenada GPS</button>
        <p id="gps-data">GPS no capturado</p>

        <label id="label-foto">Evidencia Fotográfica (Inicio)</label>
        <input type="file" accept="image/*" capture="environment" id="cameraInput">

        <!-- Campos dinámicos para INICIO -->
        <div id="seccion-inicio">
            <label>Concentrado Pequeño (130ml)</label>
            <input type="number" id="cant_pequeno" value="0" min="0">
            
            <label>Concentrado Mediano (250ml)</label>
            <input type="number" id="cant_mediano" value="0" min="0">
            
            <label>Concentrado Grande (500ml)</label>
            <input type="number" id="cant_grande" value="0" min="0">
            
            <label>Cucharas</label>
            <input type="number" id="cant_cucharas" value="0" min="0">
            
            <label>Vasos</label>
            <input type="number" id="cant_vasos" value="0" min="0">
        </div>

        <!-- Campos dinámicos para FINAL -->
        <div id="seccion-final" class="hidden">
            <h3>Gasto de Arándanos</h3>
            <label>Gasto Concentrado Pequeño (130ml)</label>
            <input type="number" id="gasto_pequeno" value="0" min="0">
            
            <label>Gasto Concentrado Mediano (250ml)</label>
            <input type="number" id="gasto_mediano" value="0" min="0">
            
            <label>Gasto Concentrado Grande (500ml)</label>
            <input type="number" id="gasto_grande" value="0" min="0">

            <h3>Resultados del Turno</h3>
            <label>Cantidad de Degustaciones Realizadas</label>
            <input type="number" id="degustaciones" value="0" min="0">
            
            <label>Cantidad de Ventas Realizadas</label>
            <input type="number" id="ventas" value="0" min="0">

            <label>Observaciones</label>
            <textarea id="observaciones" placeholder="Comentarios adicionales..."></textarea>
        </div>

        <button onclick="guardarRegistro()">Guardar e Enviar</button>

        <p class="dev-text">Desarrollado por</p>
        <img src="https://static.wixstatic.com/media/d0ce54_c999d1aa9976438a98b0f5b2157b7adc~mv2.png" alt="Logo Desarrollador" class="logo-dev">
    </div>

    <script>
        const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbx51XdwB-OtI_3VkDZWXTfDcBiWFwC7tg8xlc4s3NE9zkyXEdC58MLCd4pXYmWqGHnBXg/exec"; 
        let currentUser = "";
        let latitud = "";
        let longitud = "";

        async function login() {
            const usuario = document.getElementById('user').value.trim();
            const clave = document.getElementById('pass').value.trim();

            if (!usuario || !clave) {
                alert("Por favor completa usuario y contraseña.");
                return;
            }

            try {
                // El botón puede mostrar un estado de carga si lo deseas
                let response = await fetch(`${WEB_APP_URL}?action=login&usuario=${encodeURIComponent(usuario)}&clave=${encodeURIComponent(clave)}`);
                let result = await response.json(); // Aquí guardamos la respuesta como 'result'

                // Usamos 'result' en toda la validación
                if (result.success) {
                    currentUser = usuario;
                    const rol = result.rol; 
                    
                    // Guardamos los datos localmente
                    localStorage.setItem("user", usuario);
                    localStorage.setItem("rol", rol);
                    
                    document.getElementById("login-screen").classList.add("hidden");

                    // Validar redirección según el rol
                    if (rol.toLowerCase() === "administrador" || rol.toLowerCase() === "admin") {
                        document.getElementById("admin-screen").classList.remove("hidden");
                        document.getElementById("admin-user-display").innerText = `Administrador: ${currentUser}`;
                        cargarRegistrosAdmin();
                    } else {
                        document.getElementById("app-screen").classList.remove("hidden");
                        document.getElementById("user-display").innerText = `Usuario: ${currentUser} (${rol})`;
                        cargarClientes(); // Importante: cargar los clientes si es un usuario normal
                    }
                } else {
                    alert(result.error);
                }
            } catch (error) {
                alert("Error de conexión: " + error.message);
            }
        }
// Función para descargar y pintar los registros en la tabla
async function cargarRegistrosAdmin() {
            const tbody = document.getElementById("tabla-registros-body");
            tbody.innerHTML = `<tr><td colspan="6" class="text-center py-4 text-gray-500">Cargando registros...</td></tr>`;

            try {
                // ¡AQUÍ ESTÁ EL CAMBIO! 
                // Cambiamos API_URL por WEB_APP_URL para que coincida con tu código.
                const response = await fetch(`${WEB_APP_URL}?action=getRegistros`);
                const result = await response.json();

                if (result.success) {
                    tbody.innerHTML = "";
                    if (result.registros.length === 0) {
                        tbody.innerHTML = `<tr><td colspan="6" class="text-center py-4 text-gray-500">No hay registros disponibles.</td></tr>`;
                        return;
                    }

                    result.registros.forEach(reg => {
                        let tr = document.createElement("tr");
                        tr.className = "border-b hover:bg-gray-50";
                        tr.innerHTML = `
                            <td class="py-2 px-3">${reg.tienda}</td>
                            <td class="py-2 px-3">${reg.usuario}</td>
                            <td class="py-2 px-3">${reg.timestamp}</td>
                            <td class="py-2 px-3 text-center"><span class="px-2 py-1 rounded text-xs ${reg.estado === 'Completado' ? 'bg-green-100 text-green-800' : 'bg-yellow-100 text-yellow-800'}">${reg.estado}</span></td>
                            <td class="py-2 px-3 text-center font-bold">${reg.ventas}</td>
                            <td class="py-2 px-3 text-center">
                                ${reg.fotoInicio ? `<a href="${reg.fotoInicio}" target="_blank" class="text-blue-600 underline mr-2">Inicio</a>` : ''}
                                ${reg.fotoFinal ? `<a href="${reg.fotoFinal}" target="_blank" class="text-indigo-600 underline">Cierre</a>` : ''}
                            </td>
                        `;
                        tbody.appendChild(tr);
                    });
                } else {
                    alert("Error al cargar los datos administrativos: " + result.error);
                }
            } catch (error) {
                console.error("Error de conexión:", error);
                tbody.innerHTML = `<tr><td colspan="6" class="text-center py-4 text-red-500">Error al conectar con el servidor.</td></tr>`;
            }
        }
function cerrarSesion() {
    localStorage.clear();
    location.reload();
}

        async function cargarClientes() {
            try {
                let response = await fetch(`${WEB_APP_URL}?action=getClientes`);
                let result = await response.json();

                if (result.success) {
                    let select = document.getElementById('select_cliente');
                    select.innerHTML = '<option value="">-- Seleccione un Distribuidor --</option>';
                    result.clientes.forEach(c => {
                        let option = document.createElement('option');
                        option.value = c.nombre;
                        option.textContent = `${c.nombre} (${c.ciudad})`;
                        select.appendChild(option);
                    });
                } else {
                    alert("No se pudieron cargar los clientes.");
                }
            } catch (error) {
                console.error("Error cargando clientes:", error);
            }
        }

        function cambiarModoAccion() {
            let modo = document.getElementById('tipo_accion').value;
            if (modo === "inicio") {
                document.getElementById('seccion-inicio').classList.remove('hidden');
                document.getElementById('seccion-final').classList.add('hidden');
                document.getElementById('label-foto').innerText = "Evidencia Fotográfica (Inicio)";
            } else {
                document.getElementById('seccion-inicio').classList.add('hidden');
                document.getElementById('seccion-final').classList.remove('hidden');
                document.getElementById('label-foto').innerText = "Evidencia Fotográfica (Final / Cierre)";
            }
        }

        function capturarGPS() {
            if (navigator.geolocation) {
                document.getElementById('gps-data').innerText = "Obteniendo ubicación...";
                navigator.geolocation.getCurrentPosition(
                    (position) => {
                        latitud = position.coords.latitude;
                        longitud = position.coords.longitude;
                        document.getElementById('gps-data').innerText = `Lat: ${latitud.toFixed(6)}, Lon: ${longitud.toFixed(6)}`;
                    },
                    (error) => {
                        alert("Error obteniendo GPS: " + error.message);
                        document.getElementById('gps-data').innerText = "No se pudo obtener la ubicación";
                    },
                    { enableHighAccuracy: true }
                );
            } else {
                alert("La geolocalización no es compatible en este navegador.");
            }
        }

        async function guardarRegistro() {
            let modo = document.getElementById('tipo_accion').value;
            let tienda = document.getElementById('select_cliente').value;
            let fileInput = document.getElementById('cameraInput');

            if (!tienda) {
                alert("Selecciona un cliente o distribuidor.");
                return;
            }
            if (!latitud || !longitud) {
                alert("Debes capturar las coordenadas GPS obligatoriamente.");
                return;
            }
            if (fileInput.files.length === 0) {
                alert("La fotografía es obligatoria.");
                return;
            }

            let file = fileInput.files[0];
            let reader = new FileReader();

            reader.onload = async function(event) {
                let fotoBase64 = event.target.result;
                let payload = {
                    action: modo === "inicio" ? "registrar_inicio" : "registrar_final",
                    usuario: currentUser,
                    tienda: tienda,
                    latitud: latitud,
                    longitud: longitud,
                    timestamp: new Date().toLocaleString(),
                    fotoBase64: fotoBase64
                };

                if (modo === "inicio") {
                    payload.pequeno = document.getElementById('cant_pequeno').value;
                    payload.mediano = document.getElementById('cant_mediano').value;
                    payload.grande = document.getElementById('cant_grande').value;
                    payload.cucharas = document.getElementById('cant_cucharas').value;
                    payload.vasos = document.getElementById('cant_vasos').value;
                } else {
                    payload.gasto_pequeno = document.getElementById('gasto_pequeno').value;
                    payload.gasto_mediano = document.getElementById('gasto_mediano').value;
                    payload.gasto_grande = document.getElementById('gasto_grande').value;
                    payload.degustaciones = document.getElementById('degustaciones').value;
                    payload.ventas = document.getElementById('ventas').value;
                    payload.observaciones = document.getElementById('observaciones').value;
                }

                try {
                    let response = await fetch(WEB_APP_URL, {
                        method: "POST",
                        body: JSON.stringify(payload)
                    });
                    let result = await response.json();

                    if (result.success) {
                        alert(result.message);
                        location.reload();
                    } else {
                        alert("Error: " + result.error);
                    }
                } catch (error) {
                    alert("Error al enviar los datos: " + error.message);
                }
            };

            reader.readAsDataURL(file);
        }
      
    </script>
</body>
</html>
